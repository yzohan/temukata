<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#92b4d2" />
    <title>TemuKata | Lab Baca & Petualangan Membaca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900;1000&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      try {
        var savedTheme = localStorage.getItem('temukata_theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('temukata_theme', 'light');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="font-['Nunito',sans-serif] antialiased bg-[#EBF4FD] dark:bg-[#111C2B] text-[#304D70] dark:text-[#F0F6FF] selection:bg-[#8DB4D8] selection:text-white">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
